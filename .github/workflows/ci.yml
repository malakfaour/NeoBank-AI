name: CI Pipeline

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend-lint-test:
    name: Ruff Lint + Pytest (Backend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Check Alembic head count
        run: python backend/scripts/check_single_alembic_head.py

      - name: Check env.example matches config.py
        run: python backend/scripts/check_env_example.py

      - name: Ruff lint
        run: |
          cd backend
          ruff check .

      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_URL: redis://localhost:6379
          APP_ENV: development
        run: |
          cd backend
          pytest


  ml-tests:
    name: Pytest (ML)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r ml/requirements.txt
          pip install pytest

      - name: Run ML tests
        run: |
          pytest ml/tests -q


  frontend-lint-test:
    name: Frontend lint + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: ESLint
        run: |
          cd frontend
          npm run lint

      - name: Build
        run: |
          cd frontend
          npm run build


  docker-build-check:
    name: Docker Compose Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy env file
        run: cp .env.example .env

      - name: Build services
        run: docker compose build


  postgres-e2e-test:
    name: Postgres E2E Money-Path Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e_test
          POSTGRES_PASSWORD: e2e_test
          POSTGRES_DB: e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e_test -d e2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Alembic migrations against isolated Postgres service
        env:
          DATABASE_URL: postgresql+asyncpg://e2e_test:e2e_test@localhost:5432/e2e_test
          DATABASE_URL_DIRECT: postgresql+asyncpg://e2e_test:e2e_test@localhost:5432/e2e_test
          JWT_SECRET: ci_postgres_e2e_migration_secret_32chars_min
        run: |
          cd backend
          alembic upgrade head

      - name: Run Postgres E2E suite
        env:
          POSTGRES_TEST_URL: postgresql://e2e_test:e2e_test@localhost:5432/e2e_test
          DATABASE_URL: postgresql+asyncpg://e2e_test:e2e_test@localhost:5432/e2e_test
          DATABASE_URL_DIRECT: postgresql+asyncpg://e2e_test:e2e_test@localhost:5432/e2e_test
          JWT_SECRET: ci_postgres_e2e_migration_secret_32chars_min
          REDIS_URL: redis://localhost:6379
          APP_ENV: development
        run: |
          cd backend
          python -m pytest tests_postgres -m postgres -q